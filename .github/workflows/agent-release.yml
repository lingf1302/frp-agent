name: agent-release

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag (for example agent-v0.71.0-1)
        required: true

permissions:
  contents: write

jobs:
  build-windows-msi:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build Windows agent binaries
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $input = Join-Path $PWD ".msi-input\\windows-$env:ARCHITECTURE"
          New-Item -ItemType Directory -Force -Path $input | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = $env:ARCHITECTURE
          go build -trimpath -ldflags '-s -w' -tags 'frpc,noweb' -o (Join-Path $input 'frpc.exe') ./cmd/frpc
          go build -trimpath -ldflags '-s -w' -o (Join-Path $input 'frpc-service.exe') ./cmd/frpc-service
      - name: Install WiX CLI
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Build MSI
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $env:Path = "$env:USERPROFILE\\.dotnet\\tools;$env:Path"
          $version = (Select-String -Path pkg/util/version/version.go -Pattern '^var version = "([^"]+)"').Matches[0].Groups[1].Value
          ./hack/build-windows-msi.ps1 -Architecture $env:ARCHITECTURE -Version $version -InputDirectory ".msi-input\\windows-$env:ARCHITECTURE"
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v6
        with:
          name: frp-agent-windows-msi-${{ matrix.architecture }}
          path: dist/agent/*.msi

  build-and-publish:
    needs: build-windows-msi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then tag="${GITHUB_REF_NAME}"; else tag="${INPUT_TAG}"; fi
          [[ "${tag}" == agent-v* ]] || { echo "release tag must start with agent-v" >&2; exit 1; }
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "base_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" >> "${GITHUB_OUTPUT}"
      - name: Build agent packages
        env:
          PUBLIC_BASE_URL: ${{ steps.release.outputs.base_url }}
        run: bash ./hack/build-agent-packages.sh
      - name: Download Windows MSI artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: frp-agent-windows-msi-*
          path: dist/agent
          merge-multiple: true
      - name: Refresh checksums
        run: (cd dist/agent && sha256sum frp-agent_* > checksums.txt)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: frp-agent-${{ steps.release.outputs.tag }}
          path: dist/agent/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/agent/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/agent/* --target "${GITHUB_SHA}" --title "FRP Agent ${RELEASE_TAG}" --notes "Cross-platform frpc agent packages and service installers."
          fi
